# ============================================================================
# CI: сборка Docker-образов на GitHub и публикация в Docker Hub
# ============================================================================
# Перед первым запуском добавьте в Settings → Secrets and variables → Actions:
#   Secrets:
#     DOCKERHUB_USERNAME — логин Docker Hub (itech24)
#     DOCKERHUB_TOKEN    — Access Token из Docker Hub (Account Settings → Security)
#   Variables (необязательно):
#     NEXT_PUBLIC_API_URL — публичный URL API, вшиваемый во фронтенд
#                           (по умолчанию http://localhost:8000/api/v1)
#
# Образы публикуются:
#   itech24/tender-ai-backend  (backend + celery worker + celery beat)
#   itech24/tender-ai-frontend (Next.js)
# Теги: latest (ветка по умолчанию), короткий SHA коммита, версия по тегу vX.Y.Z
# ============================================================================

name: Build & Push Docker Images

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: itech24

jobs:
  backend:
    name: Backend (FastAPI + Celery)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/tender-ai-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (frontend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/tender-ai-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
