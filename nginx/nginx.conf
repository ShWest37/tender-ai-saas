worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Сжатие статики Next.js
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Бэкенд-сервисы docker-compose
    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Поддомены/пути API → FastAPI
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Вебхуки внешних сервисов (платежи, MAX) тоже уходят на бэкенд
        location /webhooks/ {
            rewrite ^/webhooks/(.*)$ /api/v1/$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Метрики Prometheus (закрываем доступом по IP в проде)
        location /metrics {
            proxy_pass http://backend;
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # внутренняя сеть docker
            deny all;
        }

        # Остальное → Next.js
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # === HTTPS (включается после выпуска сертификатов certbot) ===
    # Раскомментируйте блок и перезапустите контейнер nginx.
    # Сертификаты монтируются из ./nginx/ssl в /etc/nginx/ssl.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name bidflow.ru;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #
    #     location /api/ { proxy_pass http://backend; ... }
    #     location /     { proxy_pass http://frontend; ... }
    # }
    #
    # server {
    #     listen 80;
    #     server_name bidflow.ru;
    #     return 301 https://$host$request_uri;
    # }
}
